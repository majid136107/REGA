name: Restore REGA Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -iname '*.zip' | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "ZIP not found"
            exit 1
          fi

          mkdir extracted
          unzip -o "$ZIP" -d extracted

          ROOT=$(find extracted -name settings.gradle.kts -printf '%h\n' | head -n 1)
          if [ -z "$ROOT" ]; then
            echo "Project root not found"
            exit 1
          fi
          rm -rf "$ROOT/.github"
          cp -a "$ROOT"/. .
          rm -rf extracted
          rm -f "$ZIP"

      - name: Save restored files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore REGA project files" || echo "No changes"
          git push
